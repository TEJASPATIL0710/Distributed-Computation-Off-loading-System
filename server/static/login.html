<!DOCTYPE html>
<html>
<head>
    <title>Login — Compute Offload</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { width: 340px; }
        .login-box h1 { font-size: 22px; margin-bottom: 4px; }
        .login-box p { color: var(--text-muted); font-size: 13px; margin-top: 0; margin-bottom: 24px; }
        .login-box input { margin-bottom: 12px; }
        .login-box button { width: 100%; margin-top: 8px; }
        #error { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 16px; }
    </style>
</head>
<body>
    <div class="card login-box">
        <h1>Compute<span class="accent">Offload</span></h1>
        <p>Sign in to submit tasks</p>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="doLogin()">Log In</button>
        <div id="error"></div>
    </div>

    <script>
        async function doLogin() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const errorDiv = document.getElementById("error");
            errorDiv.innerText = "";

            try {
                const res = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password }),
                });

                if (!res.ok) {
                    errorDiv.innerText = "Invalid username or password.";
                    return;
                }

                const data = await res.json();
                localStorage.setItem("access_token", data.access_token);
                localStorage.setItem("username", username);
                window.location.href = "/static/app.html";
            } catch (e) {
                errorDiv.innerText = "Could not reach server.";
            }
        }
    </script>
</body>
</html>
