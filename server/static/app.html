<!DOCTYPE html>
<html>

<head>
    <title>Compute Offload</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background: var(--bg-elevated);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            font-size: 16px;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .sidebar a:hover {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .sidebar a.active {
            background: var(--accent-soft);
            color: var(--accent);
            border-left: 3px solid var(--accent);
        }

        .sidebar .whoami {
            margin-top: auto;
            font-size: 12px;
            color: var(--text-muted);
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        /* Main split area */
        .main {
            flex: 1;
            display: flex;
            padding: 24px;
            gap: 24px;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .panel h3 {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        #payload {
            flex: 1;
            resize: none;
        }

        #taskType {
            margin-bottom: 12px;
        }

        #submitBtn {
            margin-top: 12px;
        }

        #result {
            flex: 1;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h2>Compute<span class="accent">Offload</span></h2>
        <a href="/static/app.html" class="active">Submit Task</a>
        <a href="/dashboard">Dashboard</a>
        <div class="whoami">
            <div id="whoami-name"></div>
            <a href="#" onclick="logout()" style="padding-left:0; margin-top:8px;">Log Out</a>
        </div>
    </div>

    <div class="main">
        <div class="panel">
            <h3>Task</h3>
            <select id="taskType" onchange="toggleLanguageSelect()">
                <option value="general">General Script (Python)</option>
                <option value="numeric">Numeric (NumPy/SciPy)</option>
                <option value="ml">ML Inference (PyTorch)</option>
                <option value="render">Render (FFmpeg shell command)</option>
                <option value="multilang">Multi-Language</option>
            </select>

            <select id="languageSelect" style="display: none;">
                <option value="python">Python</option>
                <option value="javascript">JavaScript (Node.js)</option>
                <option value="cpp">C++</option>
            </select>
            <textarea id="payload" placeholder="Paste your script or command here..."></textarea>
            <button id="submitBtn" onclick="submitTask()">Submit Task</button>
        </div>

        <div class="panel">
            <h3>Output</h3>
            <div id="result">Result will appear here...</div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("access_token");
        if (!token) {
            window.location.href = "/static/login.html";
        }
        document.getElementById("whoami-name").innerText = "Logged in as " + localStorage.getItem("username");

        function logout() {
            localStorage.removeItem("access_token");
            localStorage.removeItem("username");
            window.location.href = "/static/login.html";
        }

        async function submitTask() {
            const taskType = document.getElementById("taskType").value;
            const payload = document.getElementById("payload").value;
            const resultDiv = document.getElementById("result");

            resultDiv.className = "";
            resultDiv.innerText = "Submitting...";

            const requestBody = { task_type: taskType, payload: payload, client_id: "web-ui" };
            if (taskType === "multilang") {
                requestBody.language = document.getElementById("languageSelect").value;
            }

            const submitRes = await fetch("/submit-task", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token,
                },
                body: JSON.stringify(requestBody),
            });

            if (submitRes.status === 401) {
                logout();
                return;
            }
            if (!submitRes.ok) {
                resultDiv.className = "error";
                resultDiv.innerText = "Submission failed: " + (await submitRes.text());
                return;
            }

            const submitData = await submitRes.json();
            resultDiv.innerText = "Queued (task_id=" + submitData.task_id + ")\nWaiting for result...";

            pollResult(submitData.task_id);
        }

        async function pollResult(taskId) {
            const resultDiv = document.getElementById("result");

            const poll = async () => {
                const res = await fetch("/task-result/" + taskId, {
                    headers: { "Authorization": "Bearer " + token },
                });
                const data = await res.json();

                if (data.state === "PENDING") {
                    setTimeout(poll, 1000);
                    return;
                }

                resultDiv.className = data.state;
                const r = data.result || {};
                let text = "State: " + data.state + "\n\n";
                text += "--- OUTPUT ---\n" + (r.stdout || "(no output)") + "\n";
                if (r.stderr) {
                    text += "\n--- ERRORS ---\n" + r.stderr;
                }
                resultDiv.innerText = text;
            };

            poll();
        }

        function toggleLanguageSelect() {
            const taskType = document.getElementById("taskType").value;
            const langSelect = document.getElementById("languageSelect");
            langSelect.style.display = taskType === "multilang" ? "block" : "none";
        }
    </script>
</body>

</html>
