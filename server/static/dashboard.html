<!DOCTYPE html>
<html>
<head>
    <title>Dashboard — Compute Offload</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar — identical to app.html for consistency */
        .sidebar {
            width: 220px;
            background: var(--bg-elevated);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar h2 { font-size: 16px; margin-bottom: 30px; }
        .sidebar a {
            display: block;
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 14px;
        }
        .sidebar a:hover { background: var(--accent-soft); color: var(--accent); }
        .sidebar a.active { background: var(--accent-soft); color: var(--accent); border-left: 3px solid var(--accent); }
        .sidebar .whoami { margin-top: auto; font-size: 12px; color: var(--text-muted); padding-top: 20px; border-top: 1px solid var(--border); }

        /* Main content */
        .main { flex: 1; padding: 24px; overflow-y: auto; }
        .main h1 { font-size: 20px; margin-bottom: 20px; }

        .cards { display: flex; gap: 16px; margin-bottom: 30px; }
        .stat-card {
            flex: 1;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }
        .stat-card .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .stat-card .number { font-size: 32px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); }

        .section-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin: 30px 0 12px 0; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        th, td { text-align: left; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border); }
        th { color: var(--accent); font-weight: 600; background: var(--bg-elevated); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge.BUSY { background: rgba(251, 191, 36, 0.15); color: var(--warning); }
        .badge.IDLE { background: rgba(74, 222, 128, 0.15); color: var(--success); }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Compute<span class="accent">Offload</span></h2>
        <a href="/static/app.html">Submit Task</a>
        <a href="/dashboard" class="active">Dashboard</a>
        <div class="whoami">
            <div id="whoami-name"></div>
            <a href="#" onclick="logout()" style="padding-left:0; margin-top:8px;">Log Out</a>
        </div>
    </div>

    <div class="main">
        <h1>Live System Dashboard</h1>

        <div class="cards">
            <div class="stat-card">
                <div class="label">Queue Length</div>
                <div class="number" id="queue-length">-</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Workers</div>
                <div class="number" id="worker-count">-</div>
            </div>
            <div class="stat-card">
                <div class="label">Busy Right Now</div>
                <div class="number" id="busy-count">-</div>
            </div>
        </div>

        <div class="section-title">Workers</div>
        <table id="workers-table">
            <tr><th>Worker</th><th>Status</th><th>Running</th></tr>
        </table>

        <div class="section-title">Recent Tasks</div>
        <table id="tasks-table">
            <tr><th>Task ID</th><th>Type</th><th>Client</th><th>Worker</th><th>State</th></tr>
        </table>
    </div>

    <script>
        const username = localStorage.getItem("username");
        document.getElementById("whoami-name").innerText = username ? "Logged in as " + username : "";

        function logout() {
            localStorage.removeItem("access_token");
            localStorage.removeItem("username");
            window.location.href = "/static/login.html";
        }

        async function refresh() {
            const res = await fetch("/dashboard-data");
            const data = await res.json();

            document.getElementById("queue-length").innerText = data.queue_length;
            document.getElementById("worker-count").innerText = data.workers.length;
            document.getElementById("busy-count").innerText = data.busy_workers;

            const workersTable = document.getElementById("workers-table");
            workersTable.innerHTML = "<tr><th>Worker</th><th>Status</th><th>Running</th></tr>";
            data.workers.forEach(w => {
                workersTable.innerHTML += `<tr>
                    <td>${w.worker}</td>
                    <td><span class="badge ${w.busy ? 'BUSY' : 'IDLE'}">${w.busy ? 'BUSY' : 'IDLE'}</span></td>
                    <td>${w.current_tasks.join(", ") || "-"}</td>
                </tr>`;
            });

            const tasksTable = document.getElementById("tasks-table");
            tasksTable.innerHTML = "<tr><th>Task ID</th><th>Type</th><th>Client</th><th>Worker</th><th>State</th></tr>";
            data.recent_tasks.forEach(t => {
                tasksTable.innerHTML += `<tr>
                    <td>${t.task_id}</td>
                    <td>${t.task_type}</td>
                    <td>${t.client}</td>
                    <td>${t.worker}</td>
                    <td class="${t.state}">${t.state}</td>
                </tr>`;
            });
        }

        refresh();
        setInterval(refresh, 2000);
    </script>
</body>
</html>
