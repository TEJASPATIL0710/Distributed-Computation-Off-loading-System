<!DOCTYPE html>
<html>
<head>
    <title>Dashboard — Compute Offload</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar — identical to app.html for consistency */
        .sidebar {
            width: 220px;
            background: var(--bg-elevated);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar h2 { font-size: 16px; margin-bottom: 30px; }
        .sidebar a {
            display: block;
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 14px;
        }
        .sidebar a:hover { background: var(--accent-soft); color: var(--accent); }
        .sidebar a.active { background: var(--accent-soft); color: var(--accent); border-left: 3px solid var(--accent); }
        .sidebar .whoami { margin-top: auto; font-size: 12px; color: var(--text-muted); padding-top: 20px; border-top: 1px solid var(--border); }

        /* Main content */
        .main { flex: 1; padding: 24px; overflow-y: auto; }
        .main h1 { font-size: 20px; margin-bottom: 20px; }

        .cards { display: flex; gap: 16px; margin-bottom: 30px; }
        .stat-card {
            flex: 1;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }
        .stat-card .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .stat-card .number { font-size: 32px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); }

        .section-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin: 30px 0 12px 0; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        th, td { text-align: left; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border); }
        th { color: var(--accent); font-weight: 600; background: var(--bg-elevated); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge.BUSY { background: rgba(251, 191, 36, 0.15); color: var(--warning); }
        .badge.IDLE { background: rgba(74, 222, 128, 0.15); color: var(--success); }
        .details-button { padding: 6px 10px; font-size: 12px; }
        dialog {
            width: min(760px, calc(100vw - 32px));
            max-height: 85vh;
            overflow-y: auto;
            color: var(--text);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 22px;
        }
        dialog::backdrop { background: rgba(0, 0, 0, 0.72); }
        .details-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px; }
        .details-header h2 { font-size: 18px; }
        .details-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .detail-field { min-width: 0; }
        .detail-label { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .7px; }
        .detail-value, .detail-block pre { overflow-wrap: anywhere; white-space: pre-wrap; margin: 5px 0 0; font-size: 12px; }
        .detail-block { margin-top: 18px; }
        .detail-block pre { max-height: 260px; overflow: auto; background: var(--bg-elevated); padding: 12px; border-radius: 6px; }
        @media (max-width: 700px) { .details-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Compute<span class="accent">Offload</span></h2>
        <a href="/static/app.html">Submit Task</a>
        <a href="/dashboard" class="active">Dashboard</a>
        <div class="whoami">
            <div id="whoami-name"></div>
            <a href="#" onclick="logout()" style="padding-left:0; margin-top:8px;">Log Out</a>
        </div>
    </div>

    <div class="main">
        <h1>Live System Dashboard</h1>

        <div class="cards">
            <div class="stat-card">
                <div class="label">Queue Length</div>
                <div class="number" id="queue-length">-</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Workers</div>
                <div class="number" id="worker-count">-</div>
            </div>
            <div class="stat-card">
                <div class="label">Busy Right Now</div>
                <div class="number" id="busy-count">-</div>
            </div>
        </div>

        <div class="section-title">Workers</div>
        <table id="workers-table">
            <tr><th>Worker</th><th>Status</th><th>Running</th></tr>
        </table>

        <div class="section-title">Task History</div>
        <table id="tasks-table">
            <tr><th>Task ID</th><th>Type</th><th>Username</th><th>Client</th><th>Worker</th><th>State</th><th>Details</th></tr>
        </table>
    </div>

    <dialog id="task-details-dialog" aria-labelledby="task-details-title">
        <div class="details-header">
            <h2 id="task-details-title">Task Details</h2>
            <button type="button" id="close-task-details">Close</button>
        </div>
        <div id="task-details-content"></div>
    </dialog>

    <script>
        const token = localStorage.getItem("access_token");
        if (!token) {
            window.location.replace("/static/login.html");
        }

        const username = localStorage.getItem("username");
        document.getElementById("whoami-name").innerText = username ? "Logged in as " + username : "";

        function logout() {
            localStorage.removeItem("access_token");
            localStorage.removeItem("username");
            window.location.href = "/static/login.html";
        }

        const detailsDialog = document.getElementById("task-details-dialog");
        const detailsContent = document.getElementById("task-details-content");
        document.getElementById("close-task-details").addEventListener("click", () => detailsDialog.close());

        function appendDetail(parent, label, value, block = false) {
            const wrapper = document.createElement(block ? "section" : "div");
            wrapper.className = block ? "detail-block" : "detail-field";
            const heading = document.createElement(block ? "h3" : "div");
            heading.className = "detail-label";
            heading.textContent = label;
            const content = document.createElement(block ? "pre" : "p");
            if (!block) content.className = "detail-value";
            content.textContent = value === null || value === undefined || value === ""
                ? "Not retained for this task"
                : String(value);
            wrapper.append(heading, content);
            parent.appendChild(wrapper);
        }

        async function downloadArtifact(artifact) {
            const response = await fetch(artifact.download_path, {
                headers: { "Authorization": "Bearer " + token },
            });
            if (response.status === 401) {
                logout();
                return;
            }
            if (!response.ok) throw new Error("Could not download " + artifact.name);

            const objectUrl = URL.createObjectURL(await response.blob());
            const link = document.createElement("a");
            link.href = objectUrl;
            link.download = artifact.name.split("/").pop() || "task-artifact";
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
        }

        async function openTaskDetails(taskId) {
            detailsContent.replaceChildren();
            detailsContent.textContent = "Loading task details...";
            detailsDialog.showModal();

            try {
                const response = await fetch("/task-details/" + encodeURIComponent(taskId), {
                    headers: { "Authorization": "Bearer " + token },
                });
                if (response.status === 401) {
                    logout();
                    return;
                }
                if (!response.ok) throw new Error("Could not load task details.");

                const task = await response.json();
                detailsContent.replaceChildren();
                const grid = document.createElement("div");
                grid.className = "details-grid";
                [
                    ["Task ID", task.task_id],
                    ["Owner", task.username],
                    ["Client ID", task.client_id],
                    ["Client address", task.ip_address],
                    ["Task type", task.task_type],
                    ["Language", task.language],
                    ["State", task.state],
                    ["Worker", task.worker],
                    ["Submitted", task.submitted_at],
                    ["Completed", task.completed_at],
                    ["Execution time (seconds)", task.execution_time_sec],
                ].forEach(([label, value]) => appendDetail(grid, label, value));
                detailsContent.appendChild(grid);
                appendDetail(detailsContent, "Submitted payload", task.payload, true);
                appendDetail(detailsContent, "Standard output", task.stdout, true);
                appendDetail(detailsContent, "Errors", task.stderr, true);
                appendDetail(detailsContent, "Complete result and artifacts", task.result ? JSON.stringify(task.result, null, 2) : null, true);
                if (task.artifacts && task.artifacts.length) {
                    const artifactSection = document.createElement("section");
                    artifactSection.className = "detail-block";
                    const artifactHeading = document.createElement("h3");
                    artifactHeading.className = "detail-label";
                    artifactHeading.textContent = "Generated files";
                    artifactSection.appendChild(artifactHeading);
                    task.artifacts.forEach(artifact => {
                        const downloadButton = document.createElement("button");
                        downloadButton.type = "button";
                        downloadButton.className = "details-button";
                        downloadButton.textContent = "Download " + artifact.name + " (" + artifact.size + " bytes)";
                        downloadButton.addEventListener("click", () => {
                            downloadArtifact(artifact).catch(error => {
                                detailsContent.dataset.downloadError = error.message;
                            });
                        });
                        artifactSection.appendChild(downloadButton);
                    });
                    detailsContent.appendChild(artifactSection);
                }
                refresh();
            } catch (error) {
                detailsContent.textContent = error.message;
            }
        }

        async function refresh() {
            const res = await fetch("/dashboard-data", {
                headers: { "Authorization": "Bearer " + token },
            });
            if (res.status === 401) {
                logout();
                return;
            }
            if (!res.ok) return;
            const data = await res.json();

            document.getElementById("queue-length").innerText = data.queue_length;
            document.getElementById("worker-count").innerText = data.workers.length;
            document.getElementById("busy-count").innerText = data.busy_workers;

            const workersTable = document.getElementById("workers-table");
            workersTable.innerHTML = "<tr><th>Worker</th><th>Status</th><th>Running</th></tr>";
            data.workers.forEach(w => {
                const row = workersTable.insertRow();
                row.insertCell().textContent = w.worker;
                const statusCell = row.insertCell();
                const statusBadge = document.createElement("span");
                statusBadge.className = "badge " + (w.busy ? "BUSY" : "IDLE");
                statusBadge.textContent = w.busy ? "BUSY" : "IDLE";
                statusCell.appendChild(statusBadge);
                row.insertCell().textContent = w.current_tasks.join(", ") || "-";
            });

            const tasksTable = document.getElementById("tasks-table");
            tasksTable.innerHTML = "<tr><th>Task ID</th><th>Type</th><th>Username</th><th>Client</th><th>Worker</th><th>State</th><th>Details</th></tr>";
            data.task_history.forEach(t => {
                const row = tasksTable.insertRow();
                row.insertCell().textContent = t.task_id;
                row.insertCell().textContent = t.task_type;
                row.insertCell().textContent = t.username || "-";
                row.insertCell().textContent = t.client;
                row.insertCell().textContent = t.worker;
                const stateCell = row.insertCell();
                stateCell.textContent = t.state;
                stateCell.className = t.state;
                const detailsCell = row.insertCell();
                const detailsButton = document.createElement("button");
                detailsButton.type = "button";
                detailsButton.className = "details-button";
                detailsButton.textContent = "View";
                detailsButton.addEventListener("click", () => openTaskDetails(t.task_id_full));
                detailsCell.appendChild(detailsButton);
            });
        }

        refresh();
        setInterval(refresh, 2000);
    </script>
</body>
</html>
